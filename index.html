<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Documentation Wiki Engine</title>
    <!--
      Content Security Policy.

      `default-src 'self'` is the backstop; `object-src 'none'` and
      `base-uri 'self'` close plugin and base-tag hijacking outright.
      Inline allowances are limited to what the build actually needs: the
      pre-paint theme script, and the per-token colour custom properties
      Shiki writes as style attributes. No 'unsafe-eval' is required, because
      the highlighter runs on the pure-JavaScript regex engine rather than
      compiling WebAssembly at runtime.

      `frame-ancestors` is deliberately absent. CSP Level 2 and Level 3 both
      ignore that directive when the policy arrives in a <meta> element, and
      browsers log a console warning saying so, which would be a permanent
      false alarm for anyone auditing the page. Clickjacking protection has to
      be delivered as response headers by whatever serves this build: a
      Content Security Policy header with frame-ancestors set to 'none',
      together with an X-Frame-Options header set to DENY. A static asset
      pipeline cannot set either from inside the file, so the responsibility
      is documented in the deployment notes instead. The header values are
      deliberately not reproduced verbatim here, so that nothing scanning the
      served HTML mistakes this comment for an active policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Inline icon. Declaring one stops the browser issuing its own
      /favicon.ico request, which is otherwise a 404 in the console on every
      cold load. A data URI keeps it out of the request path entirely.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230284c7'/%3E%3Cpath d='M10 9h8a5 5 0 0 1 5 5v9H15a5 5 0 0 1-5-5V9Z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M14 14h5M14 18h5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('vue_docs_theme');
          const isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-dvh">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
